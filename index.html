<html lang="pt-BR">
<head>

<title>GZero | ERP Logístico</title>
<style>
:root{--navy:#10243a;--navy2:#183650;--blue:#2e6f95;--cyan:#d9edf4;--bg:#f3f6f9;--surface:#fff;--text:#1c2a38;--muted:#718096;--line:#e2e8ef;--green:#16794b;--greenbg:#e5f5ec;--amber:#9a6100;--amberbg:#fff3d8;--red:#b42318;--redbg:#fee9e7;--shadow:0 8px 26px rgba(16,36,58,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.sidebar{background:var(--navy);color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:42px;height:42px;border-radius:12px;background:#d8edf5;color:var(--navy);display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.brand strong{display:block;font-size:17px;letter-spacing:.3px}.brand small{display:block;color:#a9c0d2;font-size:11px;margin-top:3px}.nav-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#819bb0;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c5d4e0;text-align:left;padding:12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#23445f;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;border-top:1px solid #2b465d;padding:16px 10px 0;color:#9db3c4;font-size:11px;line-height:1.6}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--text);font-weight:700}.top-actions{display:flex;align-items:center;gap:10px}.local-tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:7px 10px;color:#5d6b7a;background:#fbfcfd}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e3edf4;color:var(--navy);font-weight:800;font-size:12px}.content{padding:30px 32px 42px;max-width:1600px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.3px;color:var(--blue);font-weight:800;text-transform:uppercase;margin-bottom:8px}.page-head h1{margin:0;font-size:27px;letter-spacing:-.8px;color:#172b40}.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.btn{border:1px solid transparent;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}.btn-secondary{background:#fff;border-color:var(--line);color:#314255}.btn-secondary:hover{background:#f8fafc}.btn-danger{background:#fff;border-color:#f3c5c1;color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}.metric-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#edf4f8;color:var(--blue);font-size:16px}.metric-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin:12px 0 5px;color:#172b40}.metric-note{font-size:11px;color:var(--muted)}.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:14px;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.panel-body{padding:18px 20px}.text-link{border:0;background:none;color:var(--blue);font-weight:750;font-size:11px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{background:#f9fbfc;text-align:left;color:#738194;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;padding:12px 16px;border-bottom:1px solid var(--line)}.table td{padding:14px 16px;border-bottom:1px solid #edf1f5;font-size:12px}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fbfdfe}.code{font-weight:800;color:#2b5f80}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:800;white-space:nowrap;background:#eef2f6;color:#596b7c}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.s-recebida,.s-em-conferencia{background:#eaf2ff;color:#285ea8}.s-em-reparo,.s-em-terceiro,.s-em-avaliacao{background:var(--amberbg);color:var(--amber)}.s-pronta-para-expedicao,.s-concluida{background:var(--greenbg);color:var(--green)}.s-aguardando-aprovacao,.s-aguardando-peca,.s-aguardando-retorno{background:#f1eaff;color:#7045a3}.s-expedida{background:#e1f5f4;color:#08756f}.s-cancelada{background:var(--redbg);color:var(--red)}.activity{display:grid;gap:0}.activity-item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;padding:0 0 18px;position:relative}.activity-item:not(:last-child):before{content:"";position:absolute;left:14px;top:29px;bottom:0;width:1px;background:#dce5ec}.activity-icon{width:29px;height:29px;border-radius:50%;background:#edf4f8;color:var(--blue);display:grid;place-items:center;font-size:12px;z-index:1}.activity-title{font-size:12px;font-weight:750;margin:2px 0 4px}.activity-meta{font-size:10px;color:var(--muted);line-height:1.5}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}.search{position:relative;flex:1;min-width:190px}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;outline:none}.search input:focus,input:focus,select:focus,textarea:focus{border-color:#7aabc4;box-shadow:0 0 0 3px rgba(46,111,149,.1);outline:none}.search span{position:absolute;left:12px;top:9px;color:#8a98a8}.filters select{min-width:145px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;color:#405165}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.empty .empty-icon{font-size:27px;margin-bottom:10px}.empty strong{display:block;color:#34485b;font-size:13px;margin-bottom:6px}.empty p{font-size:12px;max-width:360px;margin:0 auto 15px;line-height:1.6}.section-note{margin-top:16px;padding:13px 15px;border:1px solid #d9e8f0;background:#f1f8fb;border-radius:10px;color:#526d7e;font-size:11px;line-height:1.6}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#4c5d6f}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dbe3ea;border-radius:8px;background:#fff;font-size:12px;color:#243649}.field textarea{resize:vertical;min-height:80px}.required{color:#c43d35}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.modal-backdrop{position:fixed;inset:0;background:rgba(10,25,39,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 25px 80px rgba(0,0,0,.22)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:21px 24px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:18px;margin:0}.modal-head p{font-size:11px;color:var(--muted);margin:6px 0 0}.modal-close{border:0;background:#f1f4f7;border-radius:8px;width:30px;height:30px;font-size:18px;color:#526274}.modal-content{padding:22px 24px}.toast{position:fixed;bottom:22px;right:22px;background:#173a50;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;z-index:20;display:none;max-width:min(400px,calc(100vw - 40px))}.toast.show{display:block}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.detail-card{background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:12px}.detail-card small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.detail-card strong{font-size:12px;overflow-wrap:anywhere}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:115px 18px minmax(0,1fr);gap:10px;min-height:62px}.timeline-date{font-size:10px;color:var(--muted);text-align:right;padding-top:3px}.timeline-dot{position:relative;display:flex;justify-content:center}.timeline-dot:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;z-index:1}.timeline-item:not(:last-child) .timeline-dot:after{content:"";position:absolute;top:16px;bottom:-4px;width:1px;background:#d8e2e9}.timeline-event strong{display:block;font-size:12px;margin-bottom:5px}.timeline-event p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 16px}.footer{font-size:10px;color:#8592a1;text-align:center;padding:26px 0 0}.mobile-menu{display:none}.hidden{display:none!important}
@media(max-width:1100px){.app{grid-template-columns:215px minmax(0,1fr)}.content{padding:25px 22px}.topbar{padding:0 22px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-main{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:62px;padding:0 16px}.content{padding:22px 14px}.page-head{flex-direction:column}.page-head h1{font-size:24px}.page-head>.btn{width:100%}.metrics{gap:10px}.metric{padding:14px}.metric-value{font-size:25px}.metric-top{font-size:10px}.local-tag{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail-grid{grid-template-columns:1fr 1fr}.modal-content{padding:18px}.modal-head{padding:18px}.timeline-item{grid-template-columns:82px 16px minmax(0,1fr);gap:7px}.filters{padding:12px}.filters select{flex:1;min-width:130px}.panel-head{padding:16px}.panel-body{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">GZ</div><div><strong>GZERO</strong><small>ERP LOGÍSTICO</small></div></div>
  <div><div class="nav-label">Operação</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="processos"><span class="ico">▤</span>Processos / Peças</button>
    <button data-page="recebimento"><span class="ico">⇩</span>Recebimento</button>
    <button data-page="rastreabilidade"><span class="ico">◎</span>Histórico e rastreabilidade</button>
    <button data-page="terceiros"><span class="ico">⇄</span>Serviços externos</button>
    <button data-page="documentos"><span class="ico">▧</span>Documentos fiscais</button>
    <button data-page="expedicao"><span class="ico">⇧</span>Expedição</button>
  </nav></div>
  <div class="sidebar-bottom">GZero Soluções<br>Controle de logística de reparos<br><span id="storageState">Dados salvos neste navegador</span></div>
</aside>
<main class="main">
  <header class="topbar"><div class="crumb">GZERO <span class="muted">/</span> <strong id="crumbTitle">Dashboard</strong></div><div class="top-actions"><span class="local-tag">● Ambiente local</span><div class="avatar">GZ</div></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><div><h2 id="modalTitle">Novo processo</h2><p id="modalSubtitle">Registre uma peça recebida para acompanhamento.</p></div><button class="modal-close" id="modalClose" aria-label="Fechar">×</button></div><div class="modal-content" id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
const STORAGE_KEY="gzero_erp_processes_v1";
const EVENT_KEY="gzero_erp_events_v1";
const STATUSES=["Recebida","Em conferência","Em avaliação","Aguardando aprovação","Em reparo","Aguardando peça","Em terceiro","Aguardando retorno","Pronta para expedição","Expedida","Concluída","Cancelada"];
const ACTIVE_STATUSES=["Recebida","Em conferência","Em avaliação","Aguardando aprovação","Em reparo","Aguardando peça","Em terceiro","Aguardando retorno","Pronta para expedição"];
const TITLES={dashboard:"Dashboard",processos:"Processos / Peças",recebimento:"Recebimento",rastreabilidade:"Histórico e rastreabilidade",terceiros:"Serviços externos",documentos:"Documentos fiscais",expedicao:"Expedição"};
let currentPage="dashboard", searchTerm="", statusFilter="", editingId=null, activeDetail=null, toastTimer=null;
let processes=read(STORAGE_KEY,[]), events=read(EVENT_KEY,[]);
function read(key,fallback){try{const val=localStorage.getItem(key);return val?JSON.parse(val):fallback}catch(e){return fallback}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(processes));localStorage.setItem(EVENT_KEY,JSON.stringify(events));}
function uid(){return "REP-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(value){if(!value)return "—";const d=new Date(value+"T12:00:00");return isNaN(d)?"—":d.toLocaleDateString("pt-BR")}
function fmtDateTime(value){if(!value)return "—";return new Date(value).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function slug(value){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function statusBadge(status){return '<span class="status s-'+slug(status)+'">'+esc(status||"Sem status")+'</span>'}
function addEvent(processId,title,description){events.unshift({id:"EVT-"+Date.now()+"-"+Math.random().toString(16).slice(2,6),processId,title,description:description||"",date:new Date().toISOString()})}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3000)}
function navigate(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("crumbTitle").textContent=TITLES[page]||"ERP";render()}
function pageHead(eyebrow,title,description,action){return '<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+description+'</p></div>'+(action||"")+'</div>'}
function btnNew(label){return '<button class="btn btn-primary" data-action="new-process">＋ '+label+'</button>'}
function metric(label,value,note,icon){return '<div class="metric"><div class="metric-top"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><div class="metric-value">'+value+'</div><div class="metric-note">'+note+'</div></div>'}
function processTable(rows,emptyTitle,emptyText){if(!rows.length)return '<div class="empty"><div class="empty-icon">▤</div><strong>'+emptyTitle+'</strong><p>'+emptyText+'</p><button class="btn btn-primary" data-action="new-process">＋ Cadastrar primeiro processo</button></div>';
return '<div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Cliente / Peça</th><th>Entrada</th><th>Status atual</th><th>Local atual</th><th></th></tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="text-link code" data-action="detail" data-id="'+esc(p.id)+'">'+esc(p.id)+'</button></td><td><strong>'+esc(p.client)+'</strong><br><span class="muted">'+esc(p.part)+'</span></td><td>'+fmtDate(p.entryDate)+'</td><td>'+statusBadge(p.status)+'</td><td>'+esc(p.location||"Não informado")+'</td><td><button class="btn btn-secondary" data-action="edit" data-id="'+esc(p.id)+'">Abrir</button></td></tr>').join("")+'</tbody></table></div>'}
function eventList(list){if(!list.length)return '<div class="empty"><div class="empty-icon">◷</div><strong>Nenhuma movimentação registrada</strong><p>As movimentações aparecerão aqui conforme os processos forem cadastrados e atualizados.</p></div>';return '<div class="activity">'+list.slice(0,6).map(e=>{const p=processes.find(x=>x.id===e.processId);return '<div class="activity-item"><div class="activity-icon">↗</div><div><div class="activity-title">'+esc(e.title)+'</div><div class="activity-meta">'+esc(e.processId)+(p?' · '+esc(p.client+' — '+p.part):'')+'<br>'+fmtDateTime(e.date)+(e.description?' · '+esc(e.description):'')+'</div></div></div>'}).join("")+'</div>'}
function renderDashboard(){const active=processes.filter(p=>ACTIVE_STATUSES.includes(p.status));const external=processes.filter(p=>["Em terceiro","Aguardando retorno"].includes(p.status));const ready=processes.filter(p=>p.status==="Pronta para expedição");const late=active.filter(p=>p.expectedDate&&p.expectedDate<today());return pageHead("VISÃO GERAL","Dashboard logístico","Acompanhe o fluxo de peças e os principais pontos de atenção.",btnNew("Novo processo"))+'<div class="metrics">'+metric("Processos ativos",active.length,"Peças em andamento","◷")+metric("Em serviços externos",external.length,"Aguardando terceiros ou retorno","⇄")+metric("Prontas para expedição",ready.length,"Aguardando envio ou retirada","⇧")+metric("Prazos vencidos",late.length,"Processos com previsão ultrapassada","⚑")+'</div><div class="grid-main"><section class="panel"><div class="panel-head"><div><h2>Processos recentes</h2><p>Últimos registros da operação</p></div><button class="text-link" data-page="processos">Ver todos →</button></div>'+processTable([...processes].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,5),"Seu ERP está pronto para começar","Cadastre a primeira peça para acompanhar o fluxo logístico.")+'</section><section class="panel"><div class="panel-head"><div><h2>Últimas movimentações</h2><p>Atividade recente registrada</p></div><button class="text-link" data-page="rastreabilidade">Ver histórico →</button></div><div class="panel-body">'+eventList(events)+'</div></section></div><div class="section-note"><strong>Importante:</strong> esta primeira versão salva os registros apenas neste navegador. Ainda não há banco de dados compartilhado, acesso por vários usuários, integração fiscal ou backup automático.</div>'}
function filtered(){return processes.filter(p=>{const hay=[p.id,p.client,p.part,p.brand,p.serial,p.nf,p.location,p.status,p.serviceType].join(" ").toLowerCase();return (!searchTerm||hay.includes(searchTerm.toLowerCase()))&&(!statusFilter||p.status===statusFilter)})}
function filterBar(statuses=true){return '<div class="filters"><div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar código, cliente, peça..." value="'+esc(searchTerm)+'"></div>'+(statuses?'<select id="statusFilter"><option value="">Todos os status</option>'+STATUSES.map(s=>'<option '+(statusFilter===s?'selected':'')+' value="'+esc(s)+'">'+esc(s)+'</option>').join("")+'</select>':"")+'</div>'}
function renderProcesses(){return pageHead("CONTROLE OPERACIONAL","Processos / Peças","Cada peça recebe um código de rastreio e um histórico próprio.",btnNew("Novo processo"))+'<section class="panel">'+filterBar(true)+'<div id="processTable">'+processTable(filtered(),"Nenhum processo encontrado","Cadastre um processo ou ajuste os filtros de busca.")+'</div></section><div class="section-note">O controle é focado nas peças de clientes em reparo, fabricação ou serviço externo. O estoque próprio da GZero permanece fora deste módulo.</div>'}
function renderReceiving(){const rows=processes.filter(p=>["Recebida","Em conferência","Em avaliação"].includes(p.status));return pageHead("ENTRADA DE MATERIAIS","Recebimento","Registre a chegada da peça, a condição visual e os documentos recebidos.",btnNew("Registrar recebimento"))+'<div class="metrics">'+metric("Recebidas",processes.filter(p=>p.status==="Recebida").length,"Aguardando conferência","⇩")+metric("Em conferência",processes.filter(p=>p.status==="Em conferência").length,"Identificação e inspeção visual","⌕")+metric("Em avaliação",processes.filter(p=>p.status==="Em avaliação").length,"Aguardando avaliação técnica","⚙")+metric("Total de entradas",processes.length,"Registros cadastrados","▤")+'</div><section class="panel"><div class="panel-head"><div><h2>Fila de recebimento</h2><p>Peças que estão nas etapas iniciais</p></div></div>'+processTable(rows,"Nenhuma peça na fila de recebimento","Use “Registrar recebimento” para cadastrar uma nova peça.")+'</section>'}
function renderTracking(){return pageHead("RASTREABILIDADE","Histórico e rastreabilidade","Consulte a linha do tempo e a localização atual de cada peça.",'<button class="btn btn-secondary" data-action="export-csv">⇩ Exportar CSV</button>')+'<section class="panel">'+filterBar(false)+'<div id="trackingResults">'+trackingRows(filtered())+'</div></section>'}
function trackingRows(rows){if(!rows.length)return '<div class="empty"><div class="empty-icon">◎</div><strong>Nenhuma peça para rastrear</strong><p>Cadastre um processo para começar a construir a rastreabilidade.</p><button class="btn btn-primary" data-action="new-process">＋ Novo processo</button></div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Código / Cliente</th><th>Peça</th><th>Status</th><th>Local atual</th><th>Última movimentação</th><th></th></tr></thead><tbody>'+rows.map(p=>{const last=events.find(e=>e.processId===p.id);return '<tr><td><button class="text-link code" data-action="detail" data-id="'+esc(p.id)+'">'+esc(p.id)+'</button><br><span class="muted">'+esc(p.client)+'</span></td><td>'+esc(p.part)+'</td><td>'+statusBadge(p.status)+'</td><td>'+esc(p.location||"Não informado")+'</td><td>'+fmtDateTime(last?.date)+'</td><td><button class="btn btn-secondary" data-action="detail" data-id="'+esc(p.id)+'">Linha do tempo</button></td></tr>'}).join("")+'</tbody></table></div>'}
function renderThirdParty(){const rows=processes.filter(p=>["Em terceiro","Aguardando retorno"].includes(p.status));return pageHead("FORNECEDORES EXTERNOS","Serviços externos","Acompanhe peças enviadas para terceiros e os retornos pendentes.",btnNew("Novo processo"))+'<div class="metrics">'+metric("Em terceiro",processes.filter(p=>p.status==="Em terceiro").length,"Sob responsabilidade externa","⇄")+metric("Aguardando retorno",processes.filter(p=>p.status==="Aguardando retorno").length,"Retorno ainda não registrado","◷")+metric("Com previsão vencida",rows.filter(p=>p.expectedDate&&p.expectedDate<today()).length,"Exige acompanhamento","⚑")+metric("Total em fluxo externo",rows.length,"Em terceiro ou aguardando retorno","▤")+'</div><section class="panel"><div class="panel-head"><div><h2>Peças em fluxo externo</h2><p>Registros com status de terceirização</p></div></div>'+processTable(rows,"Nenhuma peça em serviço externo","Quando uma peça for enviada a um terceiro, abra o processo e atualize o status.")+'</section>'}
function renderDocuments(){const rows=processes.filter(p=>p.nf||p.nfReturn);return pageHead("CONTROLE DOCUMENTAL","Documentos fiscais","Consulte referências de notas fiscais vinculadas aos processos.",'<button class="btn btn-secondary" data-action="export-csv">⇩ Exportar CSV</button>')+'<section class="panel">'+filterBar(false)+'<div id="documentsResults">'+documentsRows(filtered())+'</div></section><div class="section-note">Este módulo registra referências e situação dos documentos. Ele não emite, valida ou transmite NF-e à SEFAZ.</div>'}
function documentsRows(rows){if(!rows.length)return '<div class="empty"><div class="empty-icon">▧</div><strong>Nenhum documento registrado</strong><p>Os números de notas fiscais aparecem aqui quando informados no cadastro do processo.</p></div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Processo</th><th>Cliente</th><th>NF remessa / entrada</th><th>NF retorno</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="text-link code" data-action="detail" data-id="'+esc(p.id)+'">'+esc(p.id)+'</button></td><td>'+esc(p.client)+'</td><td>'+esc(p.nf||"Não informado")+'</td><td>'+esc(p.nfReturn||"Não informado")+'</td><td>'+statusBadge(p.status)+'</td><td><button class="btn btn-secondary" data-action="edit" data-id="'+esc(p.id)+'">Editar</button></td></tr>').join("")+'</tbody></table></div>'}
function renderShipping(){const rows=processes.filter(p=>["Pronta para expedição","Expedida","Concluída"].includes(p.status));return pageHead("SAÍDA E ENTREGA","Expedição","Controle de peças liberadas, enviadas ou entregues ao cliente.",btnNew("Novo processo"))+'<div class="metrics">'+metric("Prontas",processes.filter(p=>p.status==="Pronta para expedição").length,"Aguardando envio ou retirada","□")+metric("Expedidas",processes.filter(p=>p.status==="Expedida").length,"Em transporte / retirada iniciada","⇧")+metric("Concluídas",processes.filter(p=>p.status==="Concluída").length,"Ciclo encerrado","✓")+metric("Total nesta etapa",rows.length,"Peças prontas ou já enviadas","▤")+'</div><section class="panel"><div class="panel-head"><div><h2>Fila de expedição e entrega</h2><p>Peças prontas, expedidas e concluídas</p></div></div>'+processTable(rows,"Nenhuma peça nesta etapa","As peças aparecerão aqui quando o status for atualizado.")+'</section>'}
function render(){const c=document.getElementById("content");const renderers={dashboard:renderDashboard,processos:renderProcesses,recebimento:renderReceiving,rastreabilidade:renderTracking,terceiros:renderThirdParty,documentos:renderDocuments,expedicao:renderShipping};c.innerHTML=(renderers[currentPage]||renderDashboard)();document.getElementById("storageState").textContent="Dados salvos neste navegador";bindFilters()}
function bindFilters(){const s=document.getElementById("searchInput");if(s)s.addEventListener("input",()=>{searchTerm=s.value;const target=currentPage==="rastreabilidade"?"trackingResults":currentPage==="documentos"?"documentsResults":"processTable";const el=document.getElementById(target);if(el){if(currentPage==="rastreabilidade")el.innerHTML=trackingRows(filtered());else if(currentPage==="documentos")el.innerHTML=documentsRows(filtered());else el.innerHTML=processTable(filtered(),"Nenhum processo encontrado","Ajuste os filtros ou cadastre um processo.")}});const f=document.getElementById("statusFilter");if(f)f.addEventListener("change",()=>{statusFilter=f.value;const el=document.getElementById("processTable");if(el)el.innerHTML=processTable(filtered(),"Nenhum processo encontrado","Ajuste os filtros ou cadastre um processo.")})}
function openModal(id){editingId=id||null;const p=id?processes.find(x=>x.id===id):null;document.getElementById("modalTitle").textContent=p?"Editar processo "+p.id:"Novo processo logístico";document.getElementById("modalSubtitle").textContent=p?"Atualize os dados e registre a próxima etapa.":"Cadastre uma peça para iniciar o acompanhamento logístico.";const statuses=STATUSES.map(s=>'<option '+(p?.status===s?'selected':'')+' value="'+esc(s)+'">'+esc(s)+'</option>').join("");document.getElementById("modalContent").innerHTML='<form id="processForm"><div class="form-grid">'+field("client","Cliente",p?.client||"","text",true,'Ex.: Nome da empresa')+field("part","Descrição da peça",p?.part||"","text",true,'Ex.: Servo motor CNC')+field("brand","Marca",p?.brand||"","text",false,'Marca da peça')+field("serial","Nº de série / identificação",p?.serial||"","text",false,'Se disponível')+field("serviceType","Tipo de serviço",p?.serviceType||"Conserto", "select",true,"",["Conserto","Fabricação","Avaliação técnica","Outro"])+field("source","Origem do recebimento",p?.source||"Entrega do cliente","select",true,"",["Entrega do cliente","Coleta GZero","Transportadora","Outro"])+field("entryDate","Data de entrada",p?.entryDate||today(),"date",true)+field("expectedDate","Previsão de conclusão / retorno",p?.expectedDate||"","date",false)+field("status","Status atual",p?.status||"Recebida","select",true,"",STATUSES)+field("location","Localização atual",p?.location||"Recebimento","select",true,"",["Recebimento","Aguardando avaliação","Setor técnico","Aguardando aprovação","Aguardando peça","Expedição","Fornecedor externo","Transportadora","Cliente","Outro"])+field("nf","NF de entrada / remessa",p?.nf||"","text",false,"Número ou referência")+field("nfReturn","NF de retorno",p?.nfReturn||"","text",false,"Número ou referência")+field("externalProvider","Fornecedor / prestador externo",p?.externalProvider||"","text",false,"Se aplicável")+field("transport","Transportadora / retirada",p?.transport||"","text",false,"Se aplicável")+field("notes","Observações e condição visual",p?.notes||"","textarea",false,"Registre avarias, acessórios recebidos ou outras informações",[])+'</div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Salvar processo</button></div></form>';document.getElementById("modalBackdrop").classList.add("open");document.getElementById("client").focus();document.getElementById("processForm").addEventListener("submit",saveProcess)}
function field(name,label,value,type,required,placeholder,options){let control="";if(type==="select")control='<select id="'+name+'" name="'+name+'" '+(required?'required':'')+'>'+((options||[]).map(o=>'<option '+(o===value?'selected':'')+' value="'+esc(o)+'">'+esc(o)+'</option>').join(""))+'</select>';else if(type==="textarea")control='<textarea id="'+name+'" name="'+name+'" placeholder="'+esc(placeholder||"")+'">'+esc(value)+'</textarea>';else control='<input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" placeholder="'+esc(placeholder||"")+'" '+(required?'required':'')+'>';return '<div class="field '+(type==="textarea"?'full':'')+'"><label for="'+name+'">'+label+(required?' <span class="required">*</span>':'')+'</label>'+control+'</div>'}
function saveProcess(ev){ev.preventDefault();const form=new FormData(ev.target),v=Object.fromEntries(form.entries());if(!v.client.trim()||!v.part.trim()){toast("Preencha cliente e descrição da peça.");return}const now=new Date().toISOString();if(editingId){const old=processes.find(x=>x.id===editingId);if(!old)return;const changedStatus=old.status!==v.status,changedLocation=old.location!==v.location;Object.assign(old,v,{updatedAt:now});if(changedStatus)addEvent(old.id,"Status alterado para: "+v.status,"Atualização manual do processo.");if(changedLocation)addEvent(old.id,"Localização atualizada: "+v.location,"Movimentação registrada manualmente.");if(!changedStatus&&!changedLocation)addEvent(old.id,"Dados do processo atualizados","Cadastro revisado.");toast("Processo atualizado com sucesso.")}else{const p={...v,id:uid(),createdAt:now,updatedAt:now};processes.unshift(p);addEvent(p.id,"Processo criado — "+p.status,"Entrada registrada por "+p.source+".");toast("Processo cadastrado com sucesso.")}save();closeModal();render()}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open");editingId=null}
function openDetail(id){const p=processes.find(x=>x.id===id);if(!p)return;activeDetail=id;const history=events.filter(e=>e.processId===id);document.getElementById("modalTitle").textContent=p.id+" · "+p.part;document.getElementById("modalSubtitle").textContent=p.client+" · "+p.serviceType;document.getElementById("modalContent").innerHTML='<div class="detail-grid">'+detailCard("Status atual",statusBadge(p.status))+detailCard("Localização",esc(p.location||"Não informado"))+detailCard("Entrada",fmtDate(p.entryDate))+detailCard("Marca / série",esc([p.brand,p.serial].filter(Boolean).join(" · ")||"Não informado"))+detailCard("Previsão",fmtDate(p.expectedDate))+detailCard("Documentos",esc("Entrada: "+(p.nf||"—")+" · Retorno: "+(p.nfReturn||"—")))+'</div><div class="panel-head" style="padding:0 0 14px;border:0"><div><h2>Linha do tempo</h2><p>Histórico registrado deste processo</p></div></div>'+(history.length?'<div class="timeline">'+history.map(e=>'<div class="timeline-item"><div class="timeline-date">'+fmtDateTime(e.date)+'</div><div class="timeline-dot"></div><div class="timeline-event"><strong>'+esc(e.title)+'</strong><p>'+esc(e.description||"Sem observações adicionais")+'</p></div></div>').join("")+'</div>':'<div class="empty"><strong>Sem eventos registrados</strong><p>As próximas movimentações aparecerão aqui.</p></div>')+'<div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Fechar</button><button class="btn btn-primary" data-action="edit-from-detail" data-id="'+esc(id)+'">Editar processo</button></div>';document.getElementById("modalBackdrop").classList.add("open")}
function detailCard(label,value){return '<div class="detail-card"><small>'+label+'</small><strong>'+value+'</strong></div>'}
function exportCSV(){if(!processes.length){toast("Não há processos para exportar.");return}const headers=["Código","Cliente","Peça","Marca","Número de série","Tipo de serviço","Origem","Data de entrada","Previsão","Status","Localização","NF entrada/remessa","NF retorno","Fornecedor externo","Transportadora","Observações"];const keys=["id","client","part","brand","serial","serviceType","source","entryDate","expectedDate","status","location","nf","nfReturn","externalProvider","transport","notes"];const csv=[headers,...processes.map(p=>keys.map(k=>p[k]||""))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="gzero-processos-"+today()+".csv";a.click();URL.revokeObjectURL(url);toast("Exportação CSV iniciada.")}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)navigate(b.dataset.page)});
document.getElementById("content").addEventListener("click",e=>{const page=e.target.closest("[data-page]");if(page){navigate(page.dataset.page);return}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="new-process")openModal();if(a==="edit")openModal(b.dataset.id);if(a==="detail")openDetail(b.dataset.id);if(a==="edit-from-detail"){const id=b.dataset.id;closeModal();openModal(id)}if(a==="close-modal")closeModal();if(a==="export-csv")exportCSV()});
document.getElementById("modalClose").addEventListener("click",closeModal);document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
})();
</script>
</body>
